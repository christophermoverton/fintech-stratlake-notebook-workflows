[notebook_execution]
default_targets = [
  "notebooks/00_setup_and_storage_overview.ipynb",
  "notebooks/01_fintech_daily_bars_extraction_backfill.ipynb",
  "notebooks/02_fintech_session_persistence_save_restore.ipynb",
  "notebooks/03_fintech_archive_backup_pack_and_restore.ipynb",
  "notebooks/04_stratlake_feature_series_index_setup.ipynb",
  "notebooks/05_stratlake_q1_feature_data_generation_with_daily_bars_ingestion.ipynb"
]
execute_sanitized_copy = true
full_notebook_execution_enabled = false
timeout_seconds = 120
allow_errors = false
require_source_unchanged = true
write_outputs_to_source = false

[skip_patterns]
cell_source_contains = [
  "!python -m pip install",
  "!pip install",
  "drive.mount(",
  "google.colab",
  "userdata.get(",
  "getpass.getpass(",
  "!fintech-init-project",
  "!fintech-backfill",
  "!fintech-save-session",
  "!fintech-restore-session",
  "!fintech-backup-data",
  "RESTORE_COMMAND_CANDIDATE",
  "fintech-backup-data restore",
  "requests.get(",
  "requests.post(",
  "Path(\"/content/drive/MyDrive\")",
  "FINTECH_ROOT",
  "DRIVE_PROJECT_ROOT",
  "DRIVE_SESSION_ROOT",
  "DRIVE_BACKUP_ROOT",
  "BACKUP_PACK_DIR",
  "RESTORE_BACKUP_ROOT",
  "PREVIOUS_BACKUP_PACK_DIR",
  "session_manifest_paths",
  "available_drive_sessions",
  "SOURCE_DATASET_ROOT.rglob",
  "DAILY_BARS_ROOT.rglob",
  "MARKETLAKE_ROOT.rglob",
  "feature_candidates",
  ".write_text(",
  "os.chdir(",
  ".mkdir(",
  "!stratlake-init-session",
  "!stratlake-build-features",
  "!stratlake-session-export",
  "!stratlake-session-import",
  "!stratlake-session-archive",
  "STRATLAKE_ROOT",
  "available_fintech_sessions",
  "MARKETLAKE_ROOT"
]

[temporary_execution]
use_pytest_tmp_path = true
discard_executed_notebook = true
replace_skipped_cells_with_noop = true
