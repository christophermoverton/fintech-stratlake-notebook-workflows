[cli_command_registry]
schema_version = 1
description = "Repository-side registry of notebook-used upstream CLI command shapes."
default_unknown_command_policy = "warn"
accuracy_policy = "confirmed_upstream_or_current_notebook_usage_only"
scope = "Current Notebook 00-02 Fintech command surfaces; StratLake commands remain out of scope until notebook workflows reference confirmed upstream commands."
expected_missing_local_default = true
notes = [
  "This registry is a validation contract for notebook-used command syntax, not a replacement for upstream CLI implementation.",
  "Supported entries are limited to command shapes present in current notebooks, existing CLI contract validation, or recorded Colab smoke evidence.",
  "Do not add future commands, flags, or allowed values without upstream implementation/test/docs evidence or current notebook usage evidence.",
  "Flag-level `required` is intentionally not used. Use `argparse_required` for upstream parser requirements and `notebook_contract_required` for repository notebook-example expectations.",
  "Use `required_when` only for conditional runtime requirements that are not represented by argparse as unconditional required flags."
]

