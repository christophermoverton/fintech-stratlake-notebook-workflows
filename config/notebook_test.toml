[notebook_validation]
default_targets = [
  "notebooks/00_setup_and_storage_overview.ipynb",
  "notebooks/01_fintech_daily_bars_extraction_backfill.ipynb",
  "notebooks/02_fintech_session_persistence_save_restore.ipynb",
  "notebooks/03_fintech_archive_backup_pack_and_restore.ipynb",
  "notebooks/04_stratlake_feature_series_index_setup.ipynb",
  "notebooks/05_stratlake_q1_feature_data_generation_with_daily_bars_ingestion.ipynb",
  "notebooks/06_stratlake_feature_validation_archive_and_handoff.ipynb",
  "notebooks/07_stratlake_feature_consumption_baseline_research.ipynb",
  "notebooks/08_stratlake_strategy_backtest_artifact_review.ipynb"
]
require_no_outputs = true
require_null_execution_counts = true
compile_python_cells = true
skip_shell_cells = true
skip_colab_cells = true
skip_drive_mount_cells = true
skip_credential_cells = true
skip_network_cells = true
skip_artifact_commands = true
smoke_execution_enabled = false

[paths]
active_runtime_prefix = "/content"
forbidden_committed_path_fragments = [
  "C:/Users/",
  "C:\\Users\\",
  "/Users/",
  "/home/",
  "/content/drive/MyDrive/fintech-market-ingestion",
  "/content/drive/MyDrive/fintech-stratlake-tutorial"
]

[unsafe_patterns]
cell_source_contains = [
  "!python -m pip install",
  "!pip install",
  "drive.mount(",
  "userdata.get(",
  "getpass.getpass(",
  "!fintech-backup-data restore",
  "!fintech-backup-data pack",
  "!fintech-backfill",
  "!fintech-save-session",
  "!fintech-restore-session",
  "requests.get(",
  "requests.post(",
  "ALPACA_API_SECRET_KEY",
  "ALPACA_API_KEY_ID"
]

[future_safe_cells]
explicit_safe_marker = "# NOTEBOOK_TEST_SAFE"
allow_marked_smoke_cells = false
