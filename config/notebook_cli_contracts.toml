[notebook_cli_contracts]
default_targets = ["notebooks/00_setup_and_storage_overview.ipynb"]
require_installed_commands = false
allow_missing_commands = true
safe_help_only = true

[[commands]]
name = "fintech-init-project"
subcommands = []
required_flags = ["--root", "--notebooks", "--with-session", "--session-name"]

[[commands]]
name = "fintech-save-session"
subcommands = []
required_flags = ["--root", "--session-id", "--policy", "--adapter", "--destination", "--dry-run"]

[[commands]]
name = "fintech-backup-data"
subcommands = ["pack", "validate", "restore"]
required_flags = []

[[command_subcommands]]
command = "fintech-backup-data"
subcommand = "pack"
required_flags = ["--workspace-root", "--source-dataset-root", "--backup-root", "--backup-id", "--shard-size-mb", "--dry-run"]

[[command_subcommands]]
command = "fintech-backup-data"
subcommand = "validate"
required_flags = []

[[command_subcommands]]
command = "fintech-backup-data"
subcommand = "restore"
required_flags = ["--workspace-root", "--target-dataset-root", "--backup-root", "--backup-id"]
