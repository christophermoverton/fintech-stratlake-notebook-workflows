[notebook_cli_contracts]
default_targets = [
  "notebooks/00_setup_and_storage_overview.ipynb",
  "notebooks/01_fintech_daily_bars_extraction_backfill.ipynb",
  "notebooks/02_fintech_session_persistence_save_restore.ipynb"
]
require_installed_commands = false
allow_missing_commands = true
safe_help_only = true

[[commands]]
name = "fintech-init-project"
subcommands = []
required_flags = ["--root", "--notebooks", "--with-session", "--session-name"]

[[commands]]
name = "fintech-backfill-daily"
subcommands = []
required_flags = ["--symbols", "--start", "--end", "--out", "--feed", "--source", "--window"]

[[commands]]
name = "fintech-save-session"
subcommands = []
required_flags = ["--root", "--session-id", "--policy", "--adapter", "--destination", "--dry-run"]
optional_flags = ["--include-curated-data"]

[[commands]]
name = "fintech-backup-data"
subcommands = ["pack", "validate", "inspect", "restore"]
required_flags = []

[[command_subcommands]]
command = "fintech-backup-data"
subcommand = "pack"
required_flags = ["--workspace-root", "--source-dataset-root", "--backup-root", "--backup-id", "--shard-size-mb"]
optional_flags = ["--dry-run"]

[[command_subcommands]]
command = "fintech-backup-data"
subcommand = "validate"
required_flags = ["--backup-pack-dir"]

[[command_subcommands]]
command = "fintech-backup-data"
subcommand = "inspect"
required_flags = ["--backup-pack-dir"]

[[command_subcommands]]
command = "fintech-backup-data"
subcommand = "restore"
required_flags = []
optional_flags = [
  "--backup-pack-dir",
  "--restore-root",
  "--overwrite-policy",
  "--workspace-root",
  "--target-dataset-root",
  "--backup-root",
  "--backup-id"
]
